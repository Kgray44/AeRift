name: Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer:
    name: iOS renderer retry checks
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build the native app renderer
        working-directory: apps/aerift
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise connection and Bonjour retry
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'aerift-renderer-test'
          New-Item -ItemType Directory -Path $tools | Out-Null
          npm install --prefix $tools --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $driver = Join-Path $tools 'node_modules/playwright/index.mjs'
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $evidence = Join-Path $env:RUNNER_TEMP 'aerift-ios-retry-evidence'
          node tests/ci/ios-reconnect-check.mjs $driver $edge apps/aerift/dist $evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-renderer-retry
          path: ${{ runner.temp }}/aerift-ios-retry-evidence/
          if-no-files-found: error
