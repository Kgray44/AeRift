name: Windows app

on:
  pull_request:
    paths:
      - 'apps/aerift/**'
      - 'apps/windows/**'
      - 'crates/**'
      - 'packages/**'
      - 'Cargo.*'
      - 'package*.json'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/aerift/src-tauri/target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build the Windows installer
        working-directory: apps/aerift
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = 'stable'
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features private-remote-host --example private_remote_host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run tauri build -- --bundles nsis
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features private-remote-app --lib private_remote
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- ../../package-lock.json ../../Cargo.lock src-tauri/Cargo.lock
      - name: Build unsigned private Remote qualifier and checksum
        if: github.head_ref == 'feat/remote-private-windows-host'
        working-directory: apps/aerift
        shell: pwsh
        run: |
          $source = '529c482665e85c13103230c215c99eaf20435af3'
          # Build exactly the reviewed product tree, except this artifact workflow.
          git -C ../.. diff --exit-code $source HEAD -- . ':(exclude).github/workflows/windows-app.yml'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = 'stable'
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --features private-remote-host --example private_remote_host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release/examples/private_remote_host.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Missing qualifier executable' }
          $out = Join-Path $env:RUNNER_TEMP 'aerift-private-remote-qualification'
          New-Item -Path $out -ItemType Directory -ErrorAction Stop | Out-Null
          $leaf = 'AeRift-Private-Remote-Qualifier.exe'
          $binary = Join-Path $out $leaf
          Copy-Item -LiteralPath $exe -Destination $binary -ErrorAction Stop
          $sha = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $leaf" | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          @(
            "AeRift product source: $source"
            "Workflow commit: $(git rev-parse HEAD)"
            "Actions run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'Development-only Windows x64 executable, unsigned. Not an installer.'
            'No profile, test data, credentials or settings are included.'
          ) | Set-Content -LiteralPath (Join-Path $out 'SOURCE.txt') -Encoding ascii
      - name: Upload synthetic qualifier executable only
        if: github.head_ref == 'feat/remote-private-windows-host'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aerift-private-remote-qualification-windows-x64
          path: ${{ runner.temp }}/aerift-private-remote-qualification/*
          if-no-files-found: error
          retention-days: 7
      - name: Install, launch, and capture the WebView
        shell: pwsh
        run: ./apps/windows/Test-InstalledShell.ps1
      - name: Upload installer and native launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aerift-windows-x64
          path: |
            apps/aerift/src-tauri/target/release/bundle/nsis/*-setup.exe
            ${{ runner.temp }}/aerift-evidence/
          if-no-files-found: error

  private-lanes-qualification:
    name: Synthetic Remote folder and Friends delegated qualification
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify native qualification with temporary synthetic profiles
        id: native_private_lanes
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/aerift-private-lanes-target
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Private lane fixtures require a disposable GitHub-hosted Windows runner.'
          }
          function Invoke-QualifiedTests([string[]] $CargoArgs, [string[]] $Expected) {
            $testLines = & cargo @CargoArgs -- --test-threads=1 2>&1
            $status = $LASTEXITCODE
            $testLines | ForEach-Object { Write-Host $_ }
            if ($status -ne 0) { throw "cargo test failed: $status" }
            foreach ($name in $Expected) {
              $pattern = '^test (?:\S+::)?' + [regex]::Escape($name) + ' \.\.\. ok\s*$'
              if (-not ($testLines -match $pattern)) { throw "Required test did not pass: $name" }
            }
          }

          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = 'stable'
          $qualificationFailed = $false
          try {
            Invoke-QualifiedTests -CargoArgs @('test', '--locked', '-p', 'aerift-transfer',
              '--lib', 'folder::windows_handles::tests') -Expected @(
              'ntfs_typed_completed_receipt_is_verified_staged_and_published_once',
              'ntfs_folder_child_checks_spent_receipt',
              'ntfs_no_replace_is_atomic_against_a_competing_leaf_creator',
              'ntfs_pinned_relative_publish_refuses_junction_collision_and_replay')
          } catch {
            Write-Host $_
            $qualificationFailed = $true
          }
          $app = 'apps/aerift/src-tauri/Cargo.toml'
          try {
            Invoke-QualifiedTests -CargoArgs @('test', '--locked', '--manifest-path', $app,
              '--lib', 'windows_dpapi_remote_folder_records_survive_store_reconstruction') -Expected @(
              'windows_dpapi_remote_folder_records_survive_store_reconstruction')
          } catch {
            Write-Host $_
            $qualificationFailed = $true
          }
          try {
            Invoke-QualifiedTests -CargoArgs @('test', '--locked', '--manifest-path', $app,
              '--lib', 'friends_windows_delegated_profile_reopens_without_a_person_private_key') -Expected @(
              'friends_windows_delegated_profile_reopens_without_a_person_private_key')
          } catch {
            Write-Host $_
            $qualificationFailed = $true
          }
          try {
            Invoke-QualifiedTests -CargoArgs @('test', '--locked', '--manifest-path', $app,
              '--lib', 'native_wan_seed_is_protected_profile_bound_and_corruption_fails_closed') -Expected @(
              'native_wan_seed_is_protected_profile_bound_and_corruption_fails_closed')
          } catch {
            Write-Host $_
            $qualificationFailed = $true
          }
          try {
            Invoke-QualifiedTests -CargoArgs @('test', '--locked', '--manifest-path', $app,
              '--lib', 'person_actions_admit_only_person_and_offer_identifiers') -Expected @(
              'person_actions_admit_only_person_and_offer_identifiers')
          } catch {
            Write-Host $_
            $qualificationFailed = $true
          }
          try {
            Invoke-QualifiedTests -CargoArgs @('test', '--locked', '--manifest-path', $app,
              '--lib', 'friends_windows_profile_revision_reopens_and_revocation_erases_presentation') -Expected @(
              'friends_windows_profile_revision_reopens_and_revocation_erases_presentation')
          } catch {
            Write-Host $_
            $qualificationFailed = $true
          }
          if ($qualificationFailed) { throw 'One or more mandatory native fixture groups failed.' }
      - name: Verify synthetic Explorer hand pickup admission without a camera
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/aerift-private-lanes-target
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Run this fixture only on a disposable hosted Windows runner.'
          }
          $env:RUSTUP_TOOLCHAIN = 'stable'
          $lines = & cargo test --locked --manifest-path apps/aerift/src-tauri/Cargo.toml --features ambient-media-qualification --lib ambient_runtime::explorer_gesture::tests 2>&1
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or -not ($lines -match 'test result: ok\. 6 passed; 0 failed')) {
            throw 'Expected all six synthetic Explorer gesture admission tests.'
          }
          $ownerLines = & cargo test --locked --manifest-path apps/aerift/src-tauri/Cargo.toml --features ambient-media-qualification --lib ambient_runtime::explorer_camera_session:: 2>&1
          $ownerCode = $LASTEXITCODE
          $ownerLines | ForEach-Object { Write-Host $_ }
          if ($ownerCode -ne 0 -or -not ($ownerLines -match 'test result: ok\. 6 passed; 0 failed')) {
            throw 'Expected all six synthetic Explorer camera owner, indicator and revocation tests.'
          }
      - name: Verify the native camera indicator window without a camera
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/aerift-private-lanes-target
          AERIFT_HOSTED_INDICATOR_WINDOW_TEST: '1'
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'Requires disposable GitHub-hosted Windows.'
          }
          $env:RUSTUP_TOOLCHAIN = 'stable'
          $lines = & cargo test --locked --manifest-path apps/aerift/src-tauri/Cargo.toml --features ambient-media-qualification --lib ambient_runtime::explorer_camera_session::indicator::hosted_window_tests:: -- --ignored --test-threads=1 2>&1
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 0 -or -not ($lines -match 'test result: ok\. 2 passed; 0 failed')) {
            throw 'Expected both native indicator lifecycle checks without a camera.'
          }
      - name: Compile the standard Windows app without launching or publishing it
        if: ${{ !cancelled() && (steps.native_private_lanes.outcome == 'success' || steps.native_private_lanes.outcome == 'failure') }}
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/aerift-private-lanes-target
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --workspace @aerift/app run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = 'stable'
          cargo build --locked --manifest-path apps/aerift/src-tauri/Cargo.toml --bin aerift --features tauri/custom-protocol
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- package-lock.json Cargo.lock apps/aerift/src-tauri/Cargo.lock
