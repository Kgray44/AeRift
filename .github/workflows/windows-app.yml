name: Windows app

on:
  pull_request:
    paths:
      - 'apps/aerift/**'
      - 'apps/windows/**'
      - 'crates/**'
      - 'packages/**'
      - 'Cargo.*'
      - 'package*.json'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/aerift/src-tauri/target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build the Windows installer
        working-directory: apps/aerift
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = 'stable'
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features private-remote-host --example private_remote_host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run tauri build -- --bundles nsis
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- ../../package-lock.json ../../Cargo.lock src-tauri/Cargo.lock
      - name: Build unsigned private Remote qualifier and checksum
        if: github.head_ref == 'feat/remote-private-windows-host'
        working-directory: apps/aerift
        shell: pwsh
        run: |
          $source = '529c482665e85c13103230c215c99eaf20435af3'
          # Build exactly the reviewed product tree, except this artifact workflow.
          git -C ../.. diff --exit-code $source HEAD -- . ':(exclude).github/workflows/windows-app.yml'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = 'stable'
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --features private-remote-host --example private_remote_host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release/examples/private_remote_host.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Missing qualifier executable' }
          $out = Join-Path $env:RUNNER_TEMP 'aerift-private-remote-qualification'
          New-Item -Path $out -ItemType Directory -ErrorAction Stop | Out-Null
          $leaf = 'AeRift-Private-Remote-Qualifier.exe'
          $binary = Join-Path $out $leaf
          Copy-Item -LiteralPath $exe -Destination $binary -ErrorAction Stop
          $sha = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $leaf" | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          @(
            "AeRift product source: $source"
            "Workflow commit: $(git rev-parse HEAD)"
            "Actions run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'Development-only Windows x64 executable, unsigned. Not an installer.'
            'No profile, test data, credentials or settings are included.'
          ) | Set-Content -LiteralPath (Join-Path $out 'SOURCE.txt') -Encoding ascii
      - name: Upload synthetic qualifier executable only
        if: github.head_ref == 'feat/remote-private-windows-host'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aerift-private-remote-qualification-windows-x64
          path: ${{ runner.temp }}/aerift-private-remote-qualification/*
          if-no-files-found: error
          retention-days: 7
      - name: Install, launch, and capture the WebView
        shell: pwsh
        run: ./apps/windows/Test-InstalledShell.ps1
      - name: Upload installer and native launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aerift-windows-x64
          path: |
            apps/aerift/src-tauri/target/release/bundle/nsis/*-setup.exe
            ${{ runner.temp }}/aerift-evidence/
          if-no-files-found: error
