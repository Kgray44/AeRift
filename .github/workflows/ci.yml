name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows - Rust and frontend
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  apple:
    name: macOS - iOS simulator Rust target
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: rustup target add aarch64-apple-ios-sim
      - run: cargo check -p aerift-protocol -p aerift-peers -p aerift-transfer --target aarch64-apple-ios-sim --locked
