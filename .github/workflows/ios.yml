name: iOS CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notes:
    name: Integrated iPhone Browser capture with screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: 00aadb3abd4a864c26cce3bbe2ff19e5815f010b
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies and verify source
        run: |
          git diff --exit-code "$PRODUCT_SHA" HEAD -- apps packages tests Cargo.lock package-lock.json
          npm ci
      - name: Verify captured pages and render Browser evidence
        run: |
          output="$RUNNER_TEMP/mobile-browser-capture-visual"
          tools="$RUNNER_TEMP/playwright"
          mkdir -p "$output" "$tools"
          npm install --prefix "$tools" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          node "$tools/node_modules/playwright/cli.js" install --with-deps webkit
          npm exec -- vite --config tests/ui/vite.config.mts --host 127.0.0.1 --port 4173 --strictPort > "$output/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/mobile.html > /dev/null; then break; fi
            sleep 1
          done
          node - "$tools" "$output" <<'JS'
          const { readFile } = require("node:fs/promises");
          const { webkit } = require(process.argv[2] + "/node_modules/playwright");
          async function run() {
            const script = await readFile("tests/ui/mobile-browser-check.js", "utf8");
            const redirected = script.replaceAll("docs/validation/evidence/mobile-workspace/", process.argv[3] + "/");
            const scenario = eval("(" + redirected + ")");
            const browser = await webkit.launch();
            try {
              const page = await browser.newPage();
              await page.goto("http://127.0.0.1:4173/mobile.html");
              console.log(await scenario(page));
              await page.setViewportSize({ width: 390, height: 844 });
              const destinations = page.getByRole("navigation", { name: "AeRift destinations" });
              await destinations.getByRole("button", { name: /^Workspace/ }).click();
              await page.getByRole("button", { name: "Browser", exact: true }).click();
              await page.getByText("Harbor guide", { exact: true }).waitFor();
              await page.screenshot({ path: process.argv[3] + "/browser-capture-390.png",
                animations: "disabled", fullPage: true });
            } finally {
              await browser.close();
            }
          }
          run().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Retain WebKit screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-browser-capture-visual
          path: ${{ runner.temp }}/mobile-browser-capture-visual
          if-no-files-found: warn
