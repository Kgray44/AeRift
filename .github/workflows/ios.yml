name: iOS CI

on:
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'apps/aerift/**'
      - 'apps/ios/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-adapter:
    name: iOS simulator SDK - native adapters
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Lint privacy configuration
        run: |
          plutil -lint apps/aerift/src-tauri/Info.ios.plist
          plutil -lint apps/ios/PrivacyInfo.xcprivacy
          bash -n apps/ios/prepare-apple.sh
          bash -n apps/ios/simulator-smoke.sh
      - name: Typecheck Swift against the simulator SDK
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -typecheck -swift-version 5 \
            -sdk "$sdk" -target "$(uname -m)-apple-ios15.0-simulator" \
            "apps/aerift/src-tauri/src/platform/ios/swift/Sources/FilePicker.swift" \
            "apps/aerift/src-tauri/src/platform/ios/swift/Sources/FileStaging.swift" \
            "apps/aerift/src-tauri/src/platform/ios/swift/Sources/HandCamera.swift"
      - name: Test bounded native file staging
        run: |
          swiftc "apps/aerift/src-tauri/src/platform/ios/swift/Sources/FileStaging.swift" \
            apps/ios/tests/FileStagingSmoke.swift -o "$RUNNER_TEMP/file-staging-smoke"
          "$RUNNER_TEMP/file-staging-smoke"

  simulator-app:
    name: iOS simulator - Tauri app build and launch
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check for the shared host
        id: host
        run: |
          if test -f apps/aerift/src-tauri/tauri.conf.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      # Temporary while the shared Windows/Tauri host in PR #7 awaits integration.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.host.outputs.ready != 'true'
        with:
          ref: c5470a72e2ffda5149c6e94d2861503a7024542f
          path: ios-host
          persist-credentials: false

      - name: Prepare the hosted build source
        id: candidate
        env:
          HOST_READY: ${{ steps.host.outputs.ready }}
        run: |
          host=apps/aerift
          if [[ "$HOST_READY" != true ]]; then
            host=ios-host/apps/aerift
            echo "Pinned shared host: $(git -C ios-host rev-parse HEAD)"
            cp apps/aerift/src-tauri/Info.ios.plist "$host/src-tauri/"
            mkdir -p "$host/src-tauri/src/platform"
            cp -R apps/aerift/src-tauri/src/platform/ios "$host/src-tauri/src/platform/"
          fi
          echo "path=$host" >> "$GITHUB_OUTPUT"
          python3 - "$host/src-tauri" <<'PY'
          import os
          import sys
          from pathlib import Path

          host = Path(sys.argv[1])
          entry = host / "src" / "lib.rs"
          manifest = host / "Cargo.toml"
          source = entry.read_text()
          if "tauri_plugin_aerift_ios::init()" in source:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("registration=checked-out\n")
              sys.exit(0)

          # Temporary candidate overlay while Integration owns host registration.
          anchor = "    tauri::Builder::default()\n"
          if source.count(anchor) != 1:
              sys.exit("Shared host changed. Update the temporary iOS registration overlay.")
          registration = (
              "    let builder = tauri::Builder::default();\n"
              "    #[cfg(target_os = \"ios\")]\n"
              "    let builder = builder.plugin(tauri_plugin_aerift_ios::init());\n"
              "    builder\n"
          )
          entry.write_text(source.replace(anchor, registration))
          config = manifest.read_text().rstrip()
          dependency = "tauri-plugin-aerift-ios = { path = \"src/platform/ios\" }"
          section = "[target.'cfg(target_os = \"ios\")'.dependencies]"
          if dependency not in config:
              if section in config:
                  config = config.replace(section, section + "\n" + dependency)
              else:
                  config += "\n\n" + section + "\n" + dependency
          manifest.write_text(config + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("registration=ci-overlay\n")
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install iOS toolchain prerequisites
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          command -v xcodegen || brew install xcodegen
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build, install and launch AeRift
        env:
          IOS_APP_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          IOS_HOST_PATH: ${{ steps.candidate.outputs.path }}
          IOS_HOST_REGISTRATION: ${{ steps.candidate.outputs.registration }}
        run: |
          IOS_EVIDENCE_DIR="$RUNNER_TEMP/aerift-ios-evidence" bash apps/ios/simulator-smoke.sh "$IOS_HOST_PATH"
      - name: Publish simulator evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aerift-ios-simulator-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aerift-ios-evidence
          if-no-files-found: error
          retention-days: 14
