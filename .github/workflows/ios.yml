name: iOS CI

on:
  pull_request:
    paths:
      - '.github/workflows/ios.yml'
      - 'apps/aerift/**'
      - 'apps/ios/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-adapter:
    name: iOS simulator SDK - native adapters
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Lint privacy configuration
        run: plutil -lint apps/ios/Info.ios.plist
      - name: Typecheck Swift against the simulator SDK
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -typecheck -swift-version 5 \
            -sdk "$sdk" -target "$(uname -m)-apple-ios15.0-simulator" \
            apps/ios/native/FilePicker.swift
