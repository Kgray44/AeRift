name: iOS CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-adapter:
    name: iOS simulator SDK - native adapters
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 470707db8dcf875be65a8fba9315c2f24caa4ed5
          persist-credentials: false
      - name: Lint privacy configuration
        run: |
          plutil -lint apps/aerift/src-tauri/Info.ios.plist
          plutil -lint apps/ios/PrivacyInfo.xcprivacy
          bash -n apps/ios/prepare-apple.sh
          bash -n apps/ios/simulator-smoke.sh
      - name: Typecheck Swift against the simulator SDK
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -typecheck -swift-version 5 \
            -sdk "$sdk" -target "$(uname -m)-apple-ios15.0-simulator" \
            "apps/aerift/src-tauri/src/platform/ios/swift/Sources/ClipboardImagePicker.swift" \
            "apps/aerift/src-tauri/src/platform/ios/swift/Sources/FilePicker.swift" \
            "apps/aerift/src-tauri/src/platform/ios/swift/Sources/FileStaging.swift" \
            "apps/aerift/src-tauri/src/platform/ios/swift/Sources/HandCamera.swift" \
            "apps/aerift/src-tauri/src/platform/ios/swift/Sources/BonjourDiscovery.swift"
      - name: Test bounded native file staging
        run: |
          swiftc "apps/aerift/src-tauri/src/platform/ios/swift/Sources/FileStaging.swift" \
            apps/ios/tests/FileStagingSmoke.swift -o "$RUNNER_TEMP/file-staging-smoke"
          "$RUNNER_TEMP/file-staging-smoke"

  simulator-app:
    name: iOS simulator - Tauri app build and launch
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 470707db8dcf875be65a8fba9315c2f24caa4ed5
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install iOS toolchain prerequisites
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          command -v xcodegen || brew install xcodegen
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build, install and launch AeRift
        env:
          IOS_APP_SOURCE_COMMIT: 470707db8dcf875be65a8fba9315c2f24caa4ed5
        run: |
          IOS_EVIDENCE_DIR="$RUNNER_TEMP/aerift-ios-evidence" bash apps/ios/simulator-smoke.sh
      - name: Publish simulator evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aerift-ios-simulator-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aerift-ios-evidence
          if-no-files-found: warn
          retention-days: 14

  mobile-fixtures:
    name: Combined mobile WebKit and loopback transport
    runs-on: macos-15
    timeout-minutes: 22
    env:
      PRODUCT_SHA: 470707db8dcf875be65a8fba9315c2f24caa4ed5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify and build exact app source
        run: |
          git diff --exit-code "$PRODUCT_SHA" HEAD -- apps packages crates tests/ui Cargo.lock package-lock.json
          npm ci
          npm run build -w @aerift/app
          npm test
          npm run test:ui
          npm run test:gestures
      - name: Exercise the combined mobile fixture
        run: |
          output="$RUNNER_TEMP/mobile-evidence"
          mkdir -p "$output"
          tools="$RUNNER_TEMP/playwright"
          mkdir -p "$tools"
          npm install --prefix "$tools" --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          node "$tools/node_modules/playwright/cli.js" install webkit
          npm exec -- vite --config tests/ui/vite.config.mts --host 127.0.0.1 --port 4173 --strictPort > "$output/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/mobile.html > /dev/null; then break; fi
            sleep 1
          done
          node .github/ci/mobile-combined.mjs "$tools/node_modules/playwright/index.mjs" "$output" 4173
          cp docs/validation/evidence/mobile-workspace/{clipboard-sharing-390,media-import-tray-390}.png "$output/"
      - name: Verify real loopback transfers
        run: |
          output="$RUNNER_TEMP/mobile-evidence"
          cargo build --locked -p aerift-peers --example loopback_node
          node tests/acceptance/validate-peer-demo.mjs target/debug/examples/loopback_node "$RUNNER_TEMP" "$PRODUCT_SHA" matrix > "$output/transport-matrix.json"
          node tests/acceptance/validate-peer-demo.mjs target/debug/examples/loopback_node "$RUNNER_TEMP" "$PRODUCT_SHA" disconnect > "$output/transport-disconnect.json"
      - name: Retain combined evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-combined-evidence
          path: ${{ runner.temp }}/mobile-evidence
          if-no-files-found: warn
