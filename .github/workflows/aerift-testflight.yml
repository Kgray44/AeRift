name: AeRift TestFlight 6ae2a7d1462f8f2ed7b47e5d77c76ca4dd8e4de8
on:
  push:
    branches: ["codex/aerift-testflight-*"]
permissions:
  contents: read
concurrency:
  group: aerift-testflight-aerift-ios-release
  cancel-in-progress: false
jobs:
  unsigned:
    if: false
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6ae2a7d1462f8f2ed7b47e5d77c76ca4dd8e4de8
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare the iOS device toolchain
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup target add aarch64-apple-ios
      - name: Verify the unsigned iOS device archive
        run: python3 scripts/testflight/runner.py --mode upload --candidate 6ae2a7d1462f8f2ed7b47e5d77c76ca4dd8e4de8 --version 0.1.0 --build 7
      - name: Recover job-owned signing state
        if: always()
        run: python3 scripts/testflight/runner.py --cleanup-owned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aerift-testflight-upload-6ae2a7d1462f8f2ed7b47e5d77c76ca4dd8e4de8
          path: artifacts/aerift-testflight/public
          if-no-files-found: error
          retention-days: 14
  protected:
    if: true
    environment: aerift-testflight
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6ae2a7d1462f8f2ed7b47e5d77c76ca4dd8e4de8
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare the iOS device toolchain
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup target add aarch64-apple-ios
      - name: Run the protected Apple distribution operation
        env:
          AERIFT_DISTRIBUTION_P12_BASE64: ${{ secrets.AERIFT_DISTRIBUTION_P12_BASE64 }}
          AERIFT_DISTRIBUTION_P12_PASSWORD: ${{ secrets.AERIFT_DISTRIBUTION_P12_PASSWORD }}
          AERIFT_APPSTORE_PROFILE_BASE64: ${{ secrets.AERIFT_APPSTORE_PROFILE_BASE64 }}
          AERIFT_ASC_PRIVATE_KEY_P8: ${{ secrets.AERIFT_ASC_PRIVATE_KEY_P8 }}
          AERIFT_ASC_KEY_ID: ${{ vars.AERIFT_ASC_KEY_ID }}
          AERIFT_ASC_ISSUER_ID: ${{ vars.AERIFT_ASC_ISSUER_ID }}
          AERIFT_ASC_APP_ID: ${{ vars.AERIFT_ASC_APP_ID }}
          AERIFT_INTERNAL_GROUP_ID: f2e29c03-efdd-4153-9678-44438df78590
        run: |
          python3 - <<'PY'
          import argparse, os, sys, urllib.parse
          sys.path.insert(0, "scripts/testflight")
          from runner import Runner, require
          runner = Runner(argparse.Namespace(candidate="6ae2a7d1462f8f2ed7b47e5d77c76ca4dd8e4de8", mode="upload", version="0.1.0", build="7"))
          try:
              runner.configure_api()
              runner.app_record()
              group_id = os.environ["AERIFT_INTERNAL_GROUP_ID"]
              group = runner.api(f"betaGroups/{group_id}?include=app")["data"]
              require(group["attributes"]["isInternalGroup"] is True and group["relationships"]["app"]["data"]["id"] == runner.app_id, "INTERNAL_GROUP_APP_MISMATCH")
              testers = runner.api(f"betaGroups/{group_id}/betaTesters?limit=2")
              require(len(testers["data"]) == 1 and not (testers.get("links") or {}).get("next"), "INTERNAL_GROUP_AUDIENCE_CHANGED")
              result = runner.api("builds?" + urllib.parse.urlencode({"filter[app]": runner.app_id, "filter[version]": "7", "limit": "1"}))
              require(not result["data"], "BUILD_NUMBER_ALREADY_EXISTS")
          except Exception:
              sys.exit("AERIFT_UPLOAD_PREFLIGHT_FAILED")
          finally:
              if not runner.cleanup():
                  sys.exit("AERIFT_UPLOAD_PREFLIGHT_CLEANUP_FAILED")
          print("Preflight passed: expected internal group has one tester; build 7 absent.")
          PY
          python3 scripts/testflight/runner.py --mode upload --candidate 6ae2a7d1462f8f2ed7b47e5d77c76ca4dd8e4de8 --version 0.1.0 --build 7
      - name: Recover job-owned signing state
        if: always()
        run: python3 scripts/testflight/runner.py --cleanup-owned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aerift-testflight-upload-6ae2a7d1462f8f2ed7b47e5d77c76ca4dd8e4de8
          path: artifacts/aerift-testflight/public
          if-no-files-found: error
          retention-days: 14
