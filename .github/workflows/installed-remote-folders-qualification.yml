# Publication of the dedicated synthetic-only branch requires owner approval.
name: Installed Windows private folder acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/installed-remote-folders-qualification.yml'
      - 'apps/windows/Test-InstalledRemoteFolders.ps1'
      - 'apps/aerift/src-tauri/examples/installed_remote_folder_peer.rs'

permissions:
  contents: read

jobs:
  installed-folder-fixture:
    name: Installed Windows private folders (explicit synthetic consent)
    if: >-
      github.repository == 'Kgray44/AeRift' &&
      github.event.pull_request.head.repo.full_name == 'Kgray44/AeRift' &&
      github.event.pull_request.draft &&
      github.head_ref == 'qual/windows-installed-private-folders-product' &&
      github.base_ref == 'main'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build and run the disposable installed folder fixture
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/aerift-installed-folder-fixture-build
          SYNTHETIC_CONSENT: 'SYNTHETIC PRIVATE FOLDERS ONLY'
          FIXTURE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:SYNTHETIC_CONSENT -cne 'SYNTHETIC PRIVATE FOLDERS ONLY') {
            throw 'Requires a disposable GitHub-hosted runner with explicit synthetic consent.'
          }
          if ((git rev-parse HEAD) -cne $env:FIXTURE_HEAD) { throw 'Fixture checkout does not match the exact dispatched revision.' }
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = 'stable'
          cargo build --locked --manifest-path apps/aerift/src-tauri/Cargo.toml --example installed_remote_folder_peer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location apps/aerift
          try {
            npm run tauri build -- --bundles nsis
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/bundle/nsis') -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one temporary qualification installer.' }
          ./apps/windows/Test-InstalledRemoteFolders.ps1 -Installer $installers[0].FullName -FixturePeer (Join-Path $env:CARGO_TARGET_DIR 'debug/examples/installed_remote_folder_peer.exe') -Consent $env:SYNTHETIC_CONSENT
          git diff --exit-code -- package-lock.json Cargo.lock apps/aerift/src-tauri/Cargo.lock
