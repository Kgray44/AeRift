<!doctype html>
<meta charset="utf-8">
<title>AeRift photographic offer replay</title>
<main></main>
<script type="module">
import { HandLandmarkTracker, mountSendGesture } from "/dist/gestures/packages/gestures/src/index.js";

async function loadPhoto(name) {
  const image = new Image();
  image.src = "/" + name;
  await image.decode();
  return image;
}

const [open, fist] = await Promise.all([loadPhoto("right_hands.jpg"), loadPhoto("fist.jpg")]);
const canvas = document.createElement("canvas");
canvas.width = 480;
canvas.height = 360;
const context = canvas.getContext("2d");
context.scale(0.75, 0.75);

const sendCalls = [];
const selected = { deviceId: "test-peer", selectionId: "test-file" };
let liveSelection = null;
const mountPoint = document.querySelector("main");
let cameraIntent;
let feedback;
let stopCalls = 0;
const controls = mountSendGesture(mountPoint, {
  readControls: () => ({
    intent: liveSelection, busy: false, async send(intent) {
      sendCalls.push(intent);
      return true;
    },
  }),
  showPreview: false,
  createCamera({ intent, onFeedback }) {
    cameraIntent = intent;
    feedback = onFeedback;
    return {
      async start() {
        intent.begin(0);
        onFeedback(intent.setCamera("ready"));
      },
      stop() {
        stopCalls++;
        onFeedback(intent.setCamera("disabled"));
      },
      updateContext(target) { onFeedback(intent.updateContext(target)); },
    };
  },
});
const button = mountPoint.querySelector("button");
const requiresSelection = button.disabled && cameraIntent === undefined;
liveSelection = selected;
controls.update();
button.click();
const tracker = new HandLandmarkTracker();
const worker = new Worker("/gesture-assets/hand-worker.js");

function exchange(data, expected, transfer = []) {
  return new Promise((resolve, reject) => {
    worker.onmessage = ({ data: message }) => {
      if (message.type === expected) resolve(message);
      else reject(new Error(message.reason ?? message.type));
    };
    worker.onerror = (event) => reject(new Error(event.message));
    worker.postMessage({ ...data, generation: 1 }, transfer);
  });
}

const paced = new URL(location.href).searchParams.has("paced");
const poses = [];
const phases = [];
try {
  await exchange({ type: "INIT" }, "READY");
  let capture = 0;
  // Fixed playback timestamps decouple posture recognition from host scheduling.
  for (const [step, photo] of [open, fist, open, fist, open].entries()) {
    context.fillStyle = "white";
    context.fillRect(0, 0, 640, 480);
    // Align one open-hand crop with the fist fixture's palm region.
    if (photo === fist) context.drawImage(fist, 150, 80, 322, 319);
    else context.drawImage(open, 360, 0, 360, 382, 150, 0, 324, 344);
    const frames = paced && step === 0 ? 35 : 5;
    for (let frame = 0; frame < frames; frame++) {
      capture += 80;
      const bitmap = await createImageBitmap(canvas);
      const result = await exchange({ type: "FRAME", bitmap, capture }, "RESULT", [bitmap]);
      const observation = tracker.observe({
        captureMs: result.capture, width: result.width, height: result.height, hands: result.hands,
      });
      poses.push(observation.posture);
      const state = cameraIntent.observe(observation, capture);
      feedback(state);
      if (phases.at(-1) !== state.phase) phases.push(state.phase);
    }
  }
} finally {
  worker.terminate();
}
const expectedPoses = ["open", "fist", "open", "fist", "open"].flatMap((pose, step) => Array(paced && step === 0 ? 35 : 5).fill(pose));
const status = mountPoint.querySelector("[role=status]").textContent;
const stoppedAfterOffer = stopCalls === 1;
button.click();
liveSelection = { ...selected, deviceId: "other-peer" };
controls.update();
const stoppedAfterTargetChange = stopCalls === 2;
controls.dispose();
const pass = JSON.stringify(poses) === JSON.stringify(expectedPoses) &&
  phases.includes("held") && phases.at(-1) === "released" &&
  JSON.stringify(sendCalls) === JSON.stringify([selected]) && status === "Transfer offered." &&
  requiresSelection && stoppedAfterOffer && stoppedAfterTargetChange && !mountPoint.hasChildNodes();
window.replayResult = { pass, paced, phases, poses, sendCalls, status, requiresSelection, stoppedAfterOffer, stoppedAfterTargetChange };
</script>
