[package]
name = "aerift-windows-browser-pipe-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(windows)'.dependencies]
aerift-transfer = { path = "../../../crates/transfer" }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading",
    "Win32_System_IO",
] }
