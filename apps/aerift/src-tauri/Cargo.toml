[package]
name = "aerift-app"
version = "0.1.0"
edition = "2021"

# Isolated until Integration registers the native host in the root workspace.
[workspace]
resolver = "3"

[lib]
name = "aerift_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aerift"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-aerift-ios = { path = "src/platform/ios" }
libc = "0.2"

[target.'cfg(any(windows, target_os = "ios"))'.dependencies]
aerift-peers = { path = "../../../crates/peers" }
aerift-transfer = { path = "../../../crates/transfer" }
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
