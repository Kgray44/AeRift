[package]
name = "aerift-app"
version = "0.1.0"
edition = "2021"

# Isolated until Integration registers the native host in the root workspace.
[workspace]
resolver = "3"

[lib]
name = "aerift_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aerift"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-aerift-ios = { path = "src/platform/ios" }

[target.'cfg(windows)'.dependencies]
aerift-peers = { path = "../../../crates/peers" }
aerift-transfer = { path = "../../../crates/transfer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
