[package]
name = "aerift-app"
version = "0.1.0"
edition = "2021"

# Isolated until Integration registers the native host in the root workspace.
[workspace]
resolver = "3"

[lib]
name = "aerift_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-aerift-ios = { path = "src/platform/ios" }
