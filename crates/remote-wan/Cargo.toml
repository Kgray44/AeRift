[package]
name = "aerift-remote-wan"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace]
resolver = "3"

[dependencies]
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
iroh-relay = { version = "=1.5.0", default-features = false, features = ["server"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
